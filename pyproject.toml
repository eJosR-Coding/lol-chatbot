[project]
name = "lol-chatbot"
version = "0.2.0"
description = "Retrieval-augmented chatbot for League of Legends terminology (Spanish glossary, local LLM)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.2",
    "numpy>=2.4.4",
    "pydantic>=2.9.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
# Embedding model runtime (pulls in torch). CI skips it: tests use a fake encoder.
embed = ["sentence-transformers>=5.4.1"]
dev = ["pytest>=8.3.0"]
# Only needed to open the original notebook.
notebook = ["jupyter>=1.1.1", "matplotlib>=3.10.9", "seaborn>=0.13.2"]

[tool.uv]
default-groups = ["dev", "embed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
